name: Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    name: Build ${{ matrix.distro }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        distro: [debian, void]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64

          - arch: arm64
            runner: ubuntu-22.04-arm64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ matrix.distro }}-latest

      - name: Build (single arch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.distro }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar
        run: |
          docker save ${{ steps.meta.outputs.tags }} -o oci.tar

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.distro }}-${{ matrix.arch }}
          path: oci.tar

  publish:
    name: Publish Multi-Arch Images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-debian-amd64
          path: debian-amd64

      - uses: actions/download-artifact@v4
        with:
          name: image-debian-arm64
          path: debian-arm64

      - uses: actions/download-artifact@v4
        with:
          name: image-void-amd64
          path: void-amd64

      - uses: actions/download-artifact@v4
        with:
          name: image-void-arm64
          path: void-arm64

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load all images
        run: |
          docker load -i debian-amd64/oci.tar
          docker load -i debian-arm64/oci.tar
          docker load -i void-amd64/oci.tar
          docker load -i void-arm64/oci.tar

      - name: Create and push manifest lists
        run: |
          for distro in debian void; do
            docker manifest create \
              $REGISTRY/$IMAGE_NAME:$distro-latest \
              --amend $REGISTRY/$IMAGE_NAME:$distro-latest-amd64 \
              --amend $REGISTRY/$IMAGE_NAME:$distro-latest-arm64

            docker manifest push $REGISTRY/$IMAGE_NAME:$distro-latest
          done

      - name: Sign multi-arch manifests
        run: |
          for distro in debian void; do
            cosign sign --yes $REGISTRY/$IMAGE_NAME:$distro-latest
          done

  test-images:
    name: 'Test Docker images'
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-22.04-arm

  
    steps:
      - name: Test Debian image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:debian-latest zsh -c "command -v zsh starship git"
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:debian-latest zsh -c "source ~/.zshrc && echo 'Debian test successful: Hi from zsh!'"

      - name: Test Void image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:void-latest zsh -c "command -v zsh"
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:void-latest zsh -c "source ~/.zshrc && echo 'Void test successful: Hi from zsh!'"
